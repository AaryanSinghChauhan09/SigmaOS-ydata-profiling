[package]
name = "sigmaos_ydata_profiling"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ydata-profiling automated dataset profiling for SigmaOS"

[[bin]]
name = "sigmaos-ydata-profiling"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
clap = { version = "4", features = ["derive"] }
